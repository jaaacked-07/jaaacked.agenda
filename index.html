<!doctype html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>
<meta name="theme-color" content="#F6F7F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F8; --surface:#FFFFFF; --surface-2:#F0F1F3; --line:#E5E7EA; --line-2:#D6D9DE;
  --text:#1D2025; --muted:#686D75; --faint:#A2A7AE; --past:#E9EBEE; --past-ink:#9AA0A8;
  --accent:#7A2E3B; --accent-ink:#FFFFFF; --danger:#A23B3B;
  --shadow:0 1px 2px rgba(20,24,30,.04),0 6px 20px rgba(20,24,30,.05);
  --shadow-lg:0 12px 40px rgba(20,24,30,.14);
  --r:12px; --r-sm:8px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom); --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --surface:#18191C; --surface-2:#202226; --line:#2A2D31; --line-2:#383B40;
    --text:#E8EAED; --muted:#9499A1; --faint:#646971; --past:#1D1F22; --past-ink:#5C6168; --accent:#C9707F; --accent-ink:#1B1A18; --danger:#D9706E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#18191C; --surface-2:#202226; --line:#2A2D31; --line-2:#383B40;
  --text:#E8EAED; --muted:#9499A1; --faint:#646971; --past:#1D1F22; --past-ink:#5C6168; --accent:#C9707F; --accent-ink:#1B1A18; --danger:#D9706E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 14.5px/1.45 var(--sans);letter-spacing:-.003em;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);z-index:50}
.login-card{width:100%;max-width:360px;text-align:center}
.login-mark{width:56px;height:56px;margin:0 auto 22px;border-radius:14px}
.login-card h1{font:500 30px/1.1 var(--serif);letter-spacing:-.01em;margin-bottom:6px}
.login-card p{color:var(--muted);margin-bottom:28px}
.field-big{width:100%;height:48px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 16px;font-size:16px;outline:none;text-align:center;transition:border-color .15s}
.field-big:focus{border-color:var(--text)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:10px;background:var(--text);color:var(--bg);font-weight:500;transition:opacity .15s}
.btn-primary:hover{opacity:.88}
.login-card .btn-primary{width:100%;height:48px;margin-top:12px;font-size:15px}
.login-err{color:var(--danger);font-size:13px;height:18px;margin-top:10px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:264px 1fr;height:100dvh;transition:grid-template-columns .2s}
.app.side-off{grid-template-columns:0 1fr}
.app.side-off .sidebar{visibility:hidden;padding:0;border:0;overflow:hidden}
.side-toggle{margin-left:auto}
.app:not(.side-off) .side-open{display:none}
.app.side-off .side-open{display:grid}
.sidebar>*{flex-shrink:0}
.sidebar{border-right:1px solid var(--line);background:var(--surface)!important;padding:calc(22px + var(--sat)) 18px 18px calc(18px + var(--sal));display:flex;flex-direction:column;gap:22px;overflow-y:auto;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:28px;height:28px;border-radius:7px}
.brand span{font:500 19px var(--serif);letter-spacing:-.01em}
.btn-new{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:10px;background:var(--text);color:var(--bg);font-weight:500}
.btn-new:hover{opacity:.88}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:9px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.on{background:var(--surface-2);color:var(--text)}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.side-h{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.side-h button{color:var(--faint);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.side-h button:hover{color:var(--text)}
.catlist{display:flex;flex-direction:column;gap:1px}
.catlist button{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--text);text-align:left;font-size:13.5px}
.catlist button:hover{background:var(--surface-2)}
.catlist .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.catlist button.off{color:var(--faint)}
.catlist button.off .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c);opacity:.6}
.catlist .n{margin-left:auto;font-size:12px;color:var(--faint)}
/* folds */
.fold-h{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:8px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.fold-h:hover{color:var(--text);background:var(--surface-2)}
.fold-h .chev{width:14px;height:14px;transition:transform .18s}
.fold-h.open .chev{transform:rotate(90deg)}
.fold-h .fx{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
.fold-b{padding-top:6px}
.catlist .ed{margin-left:auto;font-size:12px;color:var(--muted);display:none}
.catlist .ed:hover{color:var(--text);text-decoration:underline}
.catlist button:hover .ed{display:inline}
.catlist button:hover .n{display:none}
.catlist .add{color:var(--muted)}
.catlist .add .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.sync{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);padding:0 10px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:#5E8C6A}.sync.off i{background:#B08A3E}

/* mini calendar */
.mini{padding:0 4px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px}
.mini-h b{font-weight:600;font-size:13px}
.mini-h div{display:flex;gap:2px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:11.5px}
.mini-g .wd{color:var(--faint);font-weight:500;height:22px;line-height:22px}
.mini-g button{height:28px;border-radius:7px;position:relative;font-variant-numeric:tabular-nums}
.mini-g button:hover{background:var(--surface-2)}
.mini-g button.out{color:var(--faint)}
.mini-g button.past{color:var(--past-ink)}
.mini-g button.today{color:var(--accent);font-weight:600}
.mini-g button.sel{background:var(--text);color:var(--bg)}
.mini-g button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.45;transform:translateX(-50%)}

/* main */
main{display:flex;flex-direction:column;min-width:0;height:100dvh}
.topbar{display:flex;align-items:center;gap:14px;padding:calc(18px + var(--sat)) calc(32px + var(--sar)) 14px 32px;border-bottom:1px solid transparent;min-height:72px}
.topbar h2{font:500 26px/1.15 var(--serif);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar h2 small{font:400 14px var(--sans);color:var(--muted);margin-left:10px;letter-spacing:0}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{position:relative;display:flex;align-items:center}
.search .ico{position:absolute;left:11px;color:var(--faint);width:16px;height:16px;pointer-events:none}
.search input{width:220px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px 0 34px;outline:none;font-size:13.5px;transition:border-color .15s,width .2s}
.search input:focus{border-color:var(--line-2);width:260px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn-ghost{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.btn-ghost:hover{border-color:var(--line-2)}
#view{flex:1;overflow-y:auto;padding:4px calc(32px + var(--sar)) 40px 32px;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px}

/* ---------- Rows ---------- */
.sec{margin-top:26px}
.sec:first-child{margin-top:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec-h span{font-size:12.5px;color:var(--faint)}
.sec-h.danger h3{color:var(--danger)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:56px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s;position:relative}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .bar{width:4px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.list.tint .row{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.list.tint .row:hover{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.list.tint .row.done{background:var(--surface)}
.soon{display:inline-flex;align-items:center;gap:5px;color:#A86A12;font-weight:500}
.soon svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.soon.now{color:var(--danger)}
.mh{display:flex;align-items:center;gap:8px;width:100%;margin:22px 0 10px;text-align:left;font:500 18px var(--serif);letter-spacing:-.01em;color:var(--text)}
.mh:first-of-type{margin-top:10px}
.mh .chev{width:16px;height:16px;color:var(--faint);transition:transform .18s}
.mh.open .chev{transform:rotate(90deg)}
.mh .cnt{margin-left:auto;font:400 12.5px var(--sans);color:var(--faint)}
.mh .now-tag{font:600 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:999px;padding:2px 8px}
.mh:hover .chev{color:var(--text)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .m .dotsep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.row .m .cat{color:color-mix(in srgb,var(--c) 75%,var(--text))}
.row .when{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .when.late{color:var(--danger)}
.row .when small{display:block;font-size:11.5px;color:var(--faint)}
.row .nt{font-size:12.5px;line-height:1.4;color:var(--faint);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
.pill .nt{display:block;font-size:11px;font-weight:400;opacity:.7;margin-top:2px;white-space:normal;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row.done .t{text-decoration:line-through;color:var(--faint)}
.row.done .bar{opacity:.35}
.row.ghost .t{color:var(--muted);font-weight:400}
.row.ghost .bar{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:all .15s;color:transparent}
.chk:hover{border-color:var(--c)}
.chk.on{background:var(--c);border-color:var(--c);color:#fff}
.chk.late{border-color:var(--danger)}
.chk .ico{width:13px;height:13px;stroke-width:2.4}
.chk-sp{width:22px;flex:none}
.empty{padding:22px 16px;color:var(--faint);font-size:13.5px;text-align:center}
.dayrow{display:flex;gap:18px;padding:14px 0;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.daynum{width:52px;flex:none;text-align:center;padding-top:4px}
.daynum b{display:block;font:500 24px/1 var(--serif);font-variant-numeric:tabular-nums}
.daynum span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.daynum.today b{color:var(--accent)}
.daynum small{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;white-space:nowrap}
.dayrow .list{flex:1}
.hero{margin:6px 0 4px}
.hero .stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{font:500 28px/1 var(--serif);display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:6px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.off{color:var(--faint)}
.chip.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.month-h{font:500 18px var(--serif);margin:28px 0 10px;letter-spacing:-.01em}
.month-h:first-child{margin-top:10px}

/* today card */
.today-card{background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));border-radius:16px;padding:18px 20px 6px;box-shadow:var(--shadow);margin-top:8px}
.today-card .lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.today-card h3{font:500 26px/1.15 var(--serif);letter-spacing:-.015em;margin:4px 0 4px}
.today-card .sub{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.today-card .sub b{font-weight:500;color:var(--text)}
.today-card .list{border:0;border-radius:0;background:transparent;border-top:1px solid var(--line)}
.today-card .row{padding-left:2px;padding-right:2px}
.today-card .row:hover{background:transparent}
.today-card .row .t{font-size:15.5px}
.today-card .empty{text-align:left;padding:16px 2px}
.later{opacity:.92}

/* ---------- Month grid ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.cal-head .nav2{display:flex;gap:2px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.mgrid .wd{background:var(--surface);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 10px 8px}
.cell{background:var(--surface);min-height:118px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;transition:background .12s}
.cell:hover{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.cell.out{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.cell.out .dn{color:var(--faint)}
.cell.past{background:var(--past)}
.cell.past:hover{background:var(--past)}
.cell.past .dn{color:var(--past-ink)}
.cell.past .pill:not(.done){opacity:.78}
.cell.today{background:color-mix(in srgb,var(--accent) 6%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.cell .dn{font-size:12.5px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin-bottom:1px;font-variant-numeric:tabular-nums}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--text)}
.pill{display:flex;align-items:center;gap:6px;min-height:22px;padding:0 7px 0 6px;border-radius:6px;font-size:12px;line-height:1;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 62%,var(--text));min-width:0;font-weight:500;border-left:2.5px solid var(--c)}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill em{font-style:normal;opacity:.75;font-variant-numeric:tabular-nums;flex:none}
.pill.start{background:transparent;border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);border-left:2.5px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--muted);font-weight:400}
.pill .tg{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.7;flex:none}
.pill .pc{width:18px;height:18px;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--c) 75%,transparent);background:var(--surface);flex:none;display:grid;place-items:center;color:transparent;margin-left:-1px;cursor:pointer;position:relative;transition:transform .1s}
.pill .pc::after{content:"";position:absolute;inset:-7px}
.pill .pc:active{transform:scale(.9)}
.pill .pc:hover{background:color-mix(in srgb,var(--c) 25%,transparent)}
.pill .pc.on{background:var(--c);border-color:var(--c);color:#fff}
.pill .pc.late{border-color:var(--danger)}
.pill .pc svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pill.card{display:block;padding:5px 7px 6px 7px;line-height:1.25;background:color-mix(in srgb,var(--c) 15%,var(--surface));border-left-width:3px}
.pill.card .ph{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.pill.card .ph .tg{font-size:9px;opacity:.65}
.pill.card .ph em{font-size:10.5px;margin-left:auto}
.pill.card .pt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;font-size:12px;font-weight:500}
.pill.card .pn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;font-size:10.5px;font-weight:400;opacity:.7;margin-top:2px}
.pill.card.done .pt{text-decoration:line-through}
.pill.done{opacity:.45}
.pill.done span{text-decoration:line-through}
.more{font-size:11.5px;color:var(--muted);padding-left:6px}
.mids{display:flex;gap:3px;padding:2px 4px 0;margin-top:auto}
.mids i{height:3px;flex:1;max-width:18px;border-radius:2px;background:var(--c);opacity:.45}
.dots{display:none}

/* week */

.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.links a{font-size:12.5px;color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a:hover{border-color:var(--line-2)}
.newcat{border:1px dashed var(--line-2);border-radius:12px;padding:12px;margin-top:10px}

.wcol .pill{height:auto;min-height:24px;padding:5px 7px 5px 6px;align-items:flex-start}
.wcol .pill.card .pt,.wcol .pill.card .pn{-webkit-line-clamp:4}
.wcol .pill span{white-space:normal;line-height:1.3}
.wcol .pill.mid{background:transparent;border-left:2.5px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--faint);font-weight:400}

.scrim{position:fixed;inset:0;background:rgba(20,18,16,.32);z-index:40;opacity:0;transition:opacity .2s;display:flex;justify-content:center;align-items:center;padding:24px}

.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:calc(100dvh - 48px);display:flex;flex-direction:column;transform:translateY(8px) scale(.99);transition:transform .2s}

.modal.sm{max-width:380px}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}

.m-b{padding:10px 20px 6px;overflow-y:auto}

.catpick button i{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none}

.catpick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));box-shadow:inset 0 0 0 1px var(--c);color:var(--text)}
.prev{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

.seg.full{display:flex;width:100%}

.toggle.on .sw2{background:var(--text)}
.toggle.on .sw2::after{transform:translateX(16px)}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.kbd{font-size:11.5px;color:var(--faint)}

/* settings */

.srow{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line);padding:8px 0}
.srow:first-of-type{border-top:0}
.srow .grow{flex:1;min-width:0}
.srow .sub{font-size:12.5px;color:var(--muted)}
.cdot{width:22px;height:22px;border-radius:7px;background:var(--c);flex:none;cursor:pointer;border:0}
.srow input.in{height:36px}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.palette button{width:30px;height:30px;border-radius:9px;background:var(--c);position:relative}

.pal-hint i::before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff}

  .cell .dots i.done{opacity:.35}

  .cell.past .dots i{opacity:.6}
  .cell.sel{box-shadow:none}
  .cell.sel .dn{background:var(--text);color:var(--bg)}

  .wgrid{display:flex;flex-direction:column;gap:8px}
  .wcol{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start;padding:10px 12px}
  .wcol .wh{border:0;margin:0;padding:2px 0;width:56px;flex-direction:column;gap:0}

  .scrim.show .modal{transform:none}

  .in{font-size:16px}
  .seg button{padding:0 10px}
  #toast{bottom:calc(150px + var(--sab))}

const seedId = i => 's' + String(i+1).padStart(3,'0');
function buildSeed(){
  const o = {};
  SEED_RAW.forEach((r,i)=>{
    const id = seedId(i), long = r[5]||'';
    o[id] = {id, date:r[0], start:r[1]||'', cat:r[2], type:r[3], title:r[4], note: SHORT[id] || long, more: SHORT[id] ? long : '', done:!!r[6], time:r[7]||'', timeEnd:'', updated:0};
  });
  return o;
}
/* Migração única: separa observações longas já salvas (idempotente, funciona em todos os aparelhos) */
let migrated = false;
function migrateNotes(){
  if (migrated || !S.items) return; migrated = true;
  SEED_RAW.forEach((r,i)=>{
    const id = seedId(i), it = S.items[id];
    if (it && SHORT[id] && it.note === r[5] && !it.more) putItem({...it, note: SHORT[id], more: r[5]});
  });
}

/* ---------- Datas ---------- */
const MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEM = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const SEM3 = ['dom','seg','ter','qua','qui','sex','sáb'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayIso = () => iso(new Date());
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/86400000);
const ddmm = s => { const d = parse(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1); };
const longDate = s => { const d = parse(s); return SEM[d.getDay()]+', '+d.getDate()+' de '+MES[d.getMonth()]; };
const shortDate = s => { const d = parse(s); return d.getDate()+' '+MES3[d.getMonth()]; };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function relLabel(s){
  const n = diffDays(s, todayIso());
  if (n===0) return 'Hoje';
  if (n===1) return 'Amanhã';
  if (n===-1) return 'Ontem';
  if (n>1 && n<7) return 'Em '+n+' dias';
  if (n<0) return 'Há '+(-n)+' dias';
  return shortDate(s);
}
function dateTag(s){ const d = parse(s); return SEM3[d.getDay()]+', '+ddmm(s)+'/'+d.getFullYear(); }
function whenLabel(s){
  const n = diffDays(s, todayIso());
  if (n>=-6 && n<=6) return relLabel(s)+'<small>'+dateTag(s)+'</small>';
  return dateTag(s);
}
const catShort = c => (c.short && c.short.trim()) || c.name.split(/[\s·]+/)[0].slice(0,9);
const CHK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Sincronização (Firebase) ---------- */
let FB = null;
async function initSync(){
  if (!FIREBASE_CONFIG) return;
  try {
    const V = '10.12.2';
    const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    let db;
    try { db = fs.initializeFirestore(app, {localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})}); }
    catch(e){ db = fs.getFirestore(app); }
    const itemsCol = fs.collection(db, 'users', USER, 'items');
    const catsCol = fs.collection(db, 'users', USER, 'cats');
    const metaRef = fs.doc(db, 'users', USER, 'meta', 'seed');
    FB = {fs, db, itemsCol, catsCol};

    const meta = await fs.getDoc(metaRef).catch(()=>null);
    if (meta && !meta.exists()){
      const batch = fs.writeBatch(db);
      const seedItems = S.items && Object.keys(S.items).length ? S.items : buildSeed();
      const seedCats = S.cats && Object.keys(S.cats).length ? S.cats : Object.fromEntries(DEFAULT_CATS.map(c=>[c.id,c]));
      Object.values(seedItems).forEach(it => batch.set(fs.doc(itemsCol, it.id), it));
      Object.values(seedCats).forEach(c => batch.set(fs.doc(catsCol, c.id), c));
      batch.set(metaRef, {at: Date.now()});
      await batch.commit();
    }
    fs.onSnapshot(itemsCol, snap => {
      const o = {}; snap.forEach(d => o[d.id] = d.data());
      S.items = o; persist(); setSync(snap.metadata.fromCache ? 'offline' : 'ok'); render();
      if (!snap.metadata.fromCache) migrateNotes();
    }, () => setSync('offline'));
    fs.onSnapshot(catsCol, snap => {
      const o = {}; snap.forEach(d => o[d.id] = d.data());
      if (Object.keys(o).length){ S.cats = o; persist(); render(); }
    });
    window.addEventListener('online', ()=>setSync('ok'));
    window.addEventListener('offline', ()=>setSync('offline'));
  } catch(e){
    console.error(e); setSync('erro');
  }
}
function setSync(s){ S.sync = s; renderSync(); }
function putItem(it){
  it.updated = Date.now();
  S.items[it.id] = it; persist(); render();
  if (FB) FB.fs.setDoc(FB.fs.doc(FB.itemsCol, it.id), it).catch(()=>setSync('offline'));
}
function delItem(id){
  const old = S.items[id]; delete S.items[id]; persist(); render();
  if (FB) FB.fs.deleteDoc(FB.fs.doc(FB.itemsCol, id)).catch(()=>{});
  return old;
}
function putCat(c){
  S.cats[c.id] = c; persist(); render();
  if (FB) FB.fs.setDoc(FB.fs.doc(FB.catsCol, c.id), c).catch(()=>{});
}
function delCat(id){
  delete S.cats[id]; persist();
  if (FB) FB.fs.deleteDoc(FB.fs.doc(FB.catsCol, id)).catch(()=>{});
}

/* ---------- Ocorrências por dia ---------- */
function occ(day, opts={}){
  const out = [];
  for (const it of itemsArr()){
    if (!opts.all && !visible(it)) continue;
    if (it.date === day) out.push({it, kind:'main'});
    else if (it.start && it.start === day) out.push({it, kind:'start'});
    else if (it.start && day > it.start && day < it.date) out.push({it, kind:'mid'});
  }
  const rank = {main:0, start:1, mid:2};
  return out.sort((a,b)=> rank[a.kind]-rank[b.kind] || (a.it.time||'99').localeCompare(b.it.time||'99') || (a.it.done-b.it.done) || a.it.title.localeCompare(b.it.title));
}

function renderMini(){
  const c = S.cursor, y = c.getFullYear(), m = c.getMonth();
  if (S.prefs.foldMini){ $('#mini').innerHTML = `<button class="fold-h" data-fold="foldMini">${CHEV}Mini calendário</button>`; return; }
  const first = new Date(y,m,1), startDow = first.getDay();
  const t = todayIso();
  const days = new Set(); itemsArr().filter(visible).forEach(it=>{ days.add(it.date); if(it.start) days.add(it.start); });
  let h = `<button class="fold-h open" data-fold="foldMini" style="margin-bottom:6px">${CHEV}Mini calendário</button><div class="mini-h"><b>${cap(MES[m])} ${y}</b><div><button class="icon-btn" data-act="prev">${I.left}</button><button class="icon-btn" data-act="next">${I.right}</button></div></div><div class="mini-g">`;
  h += SEM3.map(s=>`<div class="wd">${s[0].toUpperCase()}</div>`).join('');
  for (let i=0;i<42;i++){
    const d = addDays(first, i-startDow), s = iso(d);

    h += `<button class="${cls}" data-day="${s}">${d.getDate()}</button>`;
  }
  $('#mini').innerHTML = h + '</div>';
}

function weekStart(d){ const x = new Date(d); x.setDate(x.getDate()-x.getDay()); return x; }
function weekTitle(){
  const a = weekStart(S.weekRef || new Date()), b = addDays(a,6);
  if (a.getMonth()===b.getMonth()) return a.getDate()+'–'+b.getDate()+' de '+MES[a.getMonth()];
  return a.getDate()+' '+MES3[a.getMonth()]+' – '+b.getDate()+' '+MES3[b.getMonth()];
}

function rowHTML(it, opts={}){
  const c = cat(it.cat), t = todayIso();
  const kind = opts.kind || 'main';
  const late = isLate(it);
  const typeLbl = {prazo:'Prazo', aviso:'Aviso', evento:'Compromisso'}[it.type] || '';
  let meta = [`<span class="cat">${esc(c.name)}</span>`, typeLbl];
  if (it.start) meta.push(ddmm(it.start)+' → '+ddmm(it.date));
  if (it.time) meta.push(it.time + (it.timeEnd?'–'+it.timeEnd:''));
  if (kind==='start') meta.unshift('Começa hoje');
  if (kind==='mid') meta.unshift('Em andamento');
  const dn = diffDays(it.date, t);
  const soon = !it.done && dn>=0 && dn<=3 && kind==='main' && it.type!=='aviso';
  const warn = soon ? `<span class="soon ${dn===0?'now':''}" title="${dn===0?'É hoje':'Está chegando'}"><svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.3v.2"/></svg></span> ` : '';
  const when = opts.when ? `<div class="when ${late?'late':''}">${warn}${opts.when}</div>` : (soon ? `<div class="when">${warn}</div>` : '');
  const chk = true
    ? `<button class="chk ${it.done?'on':''} ${late?'late':''}" data-done="${it.id}" aria-label="${it.done?'Marcar como pendente':'Marcar como feito'}" title="${it.done?'Feito':'Pendente'}">${I.check}</button>`
    : `<span class="chk-sp"></span>`;
  const cls = ['row', it.done?'done':'', kind!=='main'?'ghost':''].join(' ');
  const dragAttr = opts.drag ? `data-drag="${it.id}" data-kind="${kind}"` : '';
  return `<div class="${cls}" data-open="${it.id}" ${dragAttr} style="--c:${c.color}">${chk}<span class="bar"></span><div class="body"><div class="t">${esc(it.title)}</div><div class="m">${meta.filter(Boolean).join('<span class="dotsep"></span>')}</div>${it.note&&kind==='main'?`<div class="nt">${esc(it.note)}</div>`:''}</div>${when}</div>`;
}
function pillHTML(o){
  const it = o.it, c = cat(it.cat), tg = `<b class="tg">${esc(catShort(c))}</b>`;
  if (o.kind==='main'){
    const late = isLate(it);
    return `<div class="pill card ${it.done?'done':''}" data-open="${it.id}" data-drag="${it.id}" data-kind="main" style="--c:${c.color}" title="${esc(c.name)}${it.done?' · feito':late?' · pendente':''}"><div class="ph"><i class="pc ${it.done?'on':''} ${late?'late':''}" data-done="${it.id}">${CHK}</i>${tg}${it.time?`<em>${it.time}</em>`:''}</div><div class="pt">${esc(it.title)}</div>${it.note?`<div class="pn">${esc(it.note)}</div>`:''}</div>`;
  }
  const tip = esc(c.name+' · '+it.title+(it.note?'\n'+it.note:''));
  if (o.kind==='start') return `<div class="pill start" data-open="${it.id}" data-drag="${it.id}" data-kind="start" style="--c:${c.color}" title="${tip} · começa (prazo até ${ddmm(it.date)})">${tg}<span>Início · ${esc(it.title)}</span></div>`;
  if (o.kind==='mid') return '';
  const late = isLate(it);
  return `<div class="pill ${it.done?'done':''}" data-open="${it.id}" data-drag="${it.id}" data-kind="main" style="--c:${c.color}" title="${tip}${it.done?' · feito':late?' · pendente':''}"><i class="pc ${it.done?'on':''} ${late?'late':''}" data-done="${it.id}">${CHK}</i>${tg}${it.time?`<em>${it.time}</em>`:''}<span>${esc(it.title)}${o.week&&it.note?`<small class="nt">${esc(it.note)}</small>`:''}</span></div>`;
}
function chipsHTML(){
  return `<div class="chips m-only">${catsArr().map(c=>`<button class="chip ${S.prefs.hidden.includes(c.id)?'off':''}" data-togglecat="${c.id}" style="--c:${c.color}"><i></i>${esc(c.name)}</button>`).join('')}<button class="chip" data-act="newcat" style="color:var(--muted)">+ Nova categoria</button></div>`;
}

/* ---------- Views ---------- */
function vHoje(){
  const t = todayIso();
  const vis = itemsArr().filter(visible);
  const today = occ(t);
  const late = vis.filter(isLate).sort((a,b)=>a.date.localeCompare(b.date));
  const week = [];
  for (let i=1;i<=7;i++){ const d = iso(addDays(new Date(),i)); const o = occ(d).filter(x=>x.kind!=='mid'); if (o.length) week.push([d,o]); }
  const limit = iso(addDays(new Date(),7));
  const later = vis.filter(it => it.type==='prazo' && it.date > limit).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const openN = vis.filter(isOpenPrazo).length;
  const weekN = vis.filter(it => isOpenPrazo(it) && it.date>=t && it.date<=limit).length;
  const nextEv = vis.filter(it => it.type==='evento' && !it.done && it.date > t).sort((a,b)=>a.date.localeCompare(b.date))[0];

  let sub = [];
  const nextLine = nextEv ? `<div class="sub" style="margin-bottom:4px">Próximo compromisso: <b>${esc(nextEv.title)}</b>, ${dateTag(nextEv.date)}, em ${diffDays(nextEv.date,t)} dias</div>` : '';
  sub.push(`${weekN} prazo${weekN===1?'':'s'} nos próximos 7 dias`, `${openN} em aberto`);
  let h = `<div class="wrap"><div class="today-card"><div class="lbl">Hoje</div><h3>${cap(longDate(t))}</h3>${nextLine}
    <div class="sub">${sub.join('<span class="dotsep" style="width:3px;height:3px;border-radius:50%;background:var(--faint)"></span>')}</div>
    <div class="list">${today.length?today.map(o=>rowHTML(o.it,{kind:o.kind, when:o.it.time||''})).join(''):'<div class="empty">Nada marcado para hoje.</div>'}</div></div>`;
  if (late.length) h += `<div class="sec"><div class="sec-h danger"><h3>Pendentes de dias anteriores</h3><span>${late.length}</span></div><div class="list">${late.map(it=>rowHTML(it,{when:whenLabel(it.date)})).join('')}</div></div>`;
  h += `<div class="sec later"><div class="sec-h"><h3>Próximos 7 dias</h3></div>`;
  h += week.length ? week.map(([d,o])=>{ const dd = parse(d); return `<div class="dayrow"><div class="daynum"><b>${dd.getDate()}</b><span>${SEM3[dd.getDay()]}</span><small>${MES3[dd.getMonth()]} ${dd.getFullYear()}</small></div><div class="list">${o.map(x=>rowHTML(x.it,{kind:x.kind, when:(x.it.time?x.it.time+' · ':'')+relLabel(d)+'<small>'+dateTag(d)+'</small>'})).join('')}</div></div>`; }).join('') : '<div class="list"><div class="empty">Semana livre.</div></div>';
  h += `</div>`;
  if (later.length) h += `<div class="sec later"><div class="sec-h"><h3>Prazos mais adiante</h3><span><button class="btn-text" style="height:auto;padding:0" data-view="prazos">Ver todos</button></span></div><div class="list">${later.map(it=>rowHTML(it,{when:whenLabel(it.date)})).join('')}</div></div>`;
  return h + '</div>';
}

function vCal(){
  return S.prefs.calMode==='semana' ? vWeek() : vMonth();
}
function vMonth(){
  const c = S.cursor, y = c.getFullYear(), m = c.getMonth();
  const first = new Date(y,m,1), startDow = first.getDay();
  const last = new Date(y,m+1,0);
  const cells = Math.ceil((startDow + last.getDate())/7)*7;
  const t = todayIso();
  let h = chipsHTML() + `<div class="mgrid" id="mgrid">` + SEM3.map(s=>`<div class="wd">${s}</div>`).join('');
  for (let i=0;i<cells;i++){
    const d = addDays(first, i-startDow), s = iso(d);
    const o = occ(s);
    const main = o.filter(x=>x.kind!=='mid');
    const show = main.slice(0,3);
    const cls = ['cell', d.getMonth()!==m?'out':'', s<t?'past':'', s===t?'today':'', s===S.sel?'sel':''].join(' ');
    h += `<div class="${cls}" data-cell="${s}"><div class="dn">${d.getDate()}</div>${show.map(pillHTML).join('')}${main.length>3?`<div class="more">+${main.length-3} mais</div>`:''}
      <div class="dots">${main.slice(0,6).map(x=>`<i class="${x.kind==='start'?'ring':x.it.done?'done':isLate(x.it)?'late':''}" style="--c:${cat(x.it.cat).color}"></i>`).join('')}</div></div>`;
  }
  h += `</div>`;
  // Lista do dia selecionado (sempre visível no celular; no computador também, abaixo da grade)
  if (parse(S.sel).getMonth()!==m) return h;
  const so = occ(S.sel);
  h += `<div class="dlist-h"><h3>${cap(longDate(S.sel))}</h3><button data-newon="${S.sel}">Adicionar</button></div>
        <div class="list">${so.length?so.map(x=>rowHTML(x.it,{kind:x.kind, when:x.it.time||'', drag:x.kind!=='mid'})).join(''):'<div class="empty">Nenhum compromisso neste dia.</div>'}</div>
        <p class="kbd" style="margin-top:10px">Para mudar a data, arraste o compromisso para outro dia${'ontouchstart' in window?' (toque e segure)':''}.</p>`;
  return h;
}
function vWeek(){
  const a = weekStart(S.weekRef || new Date()), t = todayIso();
  let h = chipsHTML() + `<div class="wgrid" id="mgrid">`;
  for (let i=0;i<7;i++){
    const d = addDays(a,i), s = iso(d), o = occ(s).filter(x=>x.kind!=='mid');
    h += `<div class="wcol ${s===t?'today':''} ${s<t?'past':''}" data-cell="${s}"><div class="wh"><b>${d.getDate()}</b><span>${SEM3[d.getDay()]}</span></div><div class="items">${o.map(x=>pillHTML({...x, week:true})).join('')}</div></div>`;
  }
  return h + '</div>';
}

function vPrazos(){
  const t = todayIso(), curKey = t.slice(0,7);
  if (S.openMonthsFor !== curKey){ S.openMonths = new Set([curKey, 'late']); S.openMonthsFor = curKey; }
  const list = itemsArr().filter(visible).filter(it => it.type==='prazo').sort((a,b)=> a.date.localeCompare(b.date) || a.title.localeCompare(b.title));
  let h = `<div class="wrap">${chipsHTML()}`;
  if (!list.length) return h + `<div class="list" style="margin-top:16px"><div class="empty">Nenhum prazo cadastrado.</div></div></div>`;
  const groups = {};
  list.forEach(it => { const k = isLate(it) ? 'late' : it.date.slice(0,7); (groups[k] = groups[k]||[]).push(it); });
  const keys = Object.keys(groups).sort((a,b)=> a==='late'?-1:b==='late'?1: a.localeCompare(b));
  keys.forEach(k => {
    const open = S.openMonths.has(k);
    const label = k==='late' ? '<span style="color:var(--danger)">Pendentes de dias anteriores</span>' : (()=>{ const [y,m]=k.split('-'); return cap(MES[+m-1])+' '+y; })();
    const done = groups[k].filter(i=>i.done).length;
    const cnt = k==='late' ? `${groups[k].length}` : `${done}/${groups[k].length} feitos`;
    h += `<button class="mh ${open?'open':''}" data-month="${k}">${CHEV.replace('class="ico chev"','class="ico chev"')}${label}${k===curKey?'<span class="now-tag">Mês atual</span>':''}<span class="cnt">${cnt}</span></button>`;
    if (open) h += `<div class="list tint">${groups[k].map(it=>rowHTML(it,{when: whenLabel(it.date)})).join('')}</div>`;
  });
  return h + '</div>';
}

function vBusca(){
  const q = S.q.trim().toLowerCase();
  const list = itemsArr().filter(it => (it.title+' '+(it.note||'')+' '+(it.more||'')+' '+cat(it.cat).name).toLowerCase().includes(q)).sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="wrap"><div class="sec"><div class="sec-h"><h3>Resultados</h3><span>${list.length}</span></div><div class="list">${list.length?list.map(it=>rowHTML(it,{when:whenLabel(it.date)})).join(''):'<div class="empty">Nada encontrado.</div>'}</div></div></div>`;
}

  return `<div class="wrap" style="max-width:640px">
  <div class="card"><h4>Categorias</h4>
    ${catsArr().map(c=>`<div class="srow"><button class="cdot" style="--c:${c.color}" data-editcat="${c.id}" aria-label="Editar"></button><div class="grow">${esc(c.name)}<div class="sub">${itemsArr().filter(i=>i.cat===c.id).length} itens</div></div><button class="btn-text" data-editcat="${c.id}">Editar</button></div>`).join('')}
    <div class="srow"><div class="grow"></div><button class="btn-text" data-act="newcat">${I.plus.replace('class="ico"','class="ico" style="display:inline;vertical-align:-4px;margin-right:4px"')}Nova categoria</button></div>
  </div>
  <div class="card"><h4>Aparência</h4>
    <div class="srow"><div class="grow">Tema</div><div class="seg"><button class="${th==='auto'?'on':''}" data-theme="auto">Automático</button><button class="${th==='light'?'on':''}" data-theme="light">Claro</button><button class="${th==='dark'?'on':''}" data-theme="dark">Escuro</button></div></div>
  </div>
  <div class="card"><h4>Lembretes no celular</h4>
    <div class="srow"><div class="grow">Exportar para Google ou Apple Agenda<div class="sub">Gera um arquivo .ics com os prazos e compromissos futuros, com alerta às 9h do dia anterior.</div></div><button class="btn-ghost" data-act="ics">Exportar</button></div>

function renderView(){
  const v = $('#view');
  let h;
  if (S.q.trim()) h = vBusca();
  else h = {hoje:vHoje, cal:vCal, prazos:vPrazos, ajustes:vAjustes}[S.view]();
  v.innerHTML = h;
  if (S.view==='cal' && !S.q) bindSwipe();
}
function render(){
  if (!S.items) return;
  renderNav(); renderCats(); renderMini(); renderSync(); renderTop(); renderView();
}

/* ---------- Modal ---------- */
let modalEl = null;
function openModal(html, cls=''){
  closeModal(true);
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="modal ${cls}" role="dialog"><div class="grab"></div>${html}</div>`;
  document.body.appendChild(s);
  requestAnimationFrame(()=>s.classList.add('show'));
  s.addEventListener('mousedown', e => { if (e.target===s) closeModal(); });
  modalEl = s;
  return s;
}
function closeModal(instant){
  if (!modalEl) return;
  const s = modalEl; modalEl = null;
  if (instant) { s.remove(); return; }
  s.classList.remove('show'); setTimeout(()=>s.remove(), 200);
}
function confirmBox(title, text, okLbl, onOk){
  const s = openModal(`<div class="m-h"><h3>${title}</h3></div><div class="m-b"><p style="color:var(--muted)">${text}</p></div><div class="m-f"><span class="sp"></span><button class="btn-text" data-x>Cancelar</button><button class="btn-primary" data-ok style="background:var(--danger);color:#fff">${okLbl}</button></div>`, 'sm');
  s.querySelector('[data-x]').onclick = () => closeModal();
  s.querySelector('[data-ok]').onclick = () => { closeModal(); onOk(); };
}

function openEditor(id, preset={}){
  const ex = id ? S.items[id] : null;
  const it = ex ? {...ex} : preset.copy ? {...preset.copy} : {id:uid(), title:'', cat: preset.cat || (catsArr()[0]||{}).id || 'pessoal', type:'evento', date: preset.date || S.sel || todayIso(), start:'', time:'', timeEnd:'', note:'', done:false};
  const ranged = !!it.start;
  const allDay = !it.time;
  const s = openModal(`
    <div class="m-h"><h3>${ex?'Editar':'Novo compromisso'}</h3><button class="icon-btn" data-x aria-label="Fechar">${I.x}</button></div>
    <div class="m-b">
      <div class="f"><input class="in title" id="eTitle" placeholder="Título" value="${esc(it.title)}"></div>
      <div class="f"><div style="display:flex;align-items:baseline;justify-content:space-between"><label class="l">Categoria</label><button type="button" class="btn-text" data-newcat style="height:auto;padding:0;font-size:12.5px">+ Nova categoria</button></div><div class="catpick" id="eCat"></div>
        <div class="newcat hidden" id="eNewCat"><input class="in" id="eNcName" placeholder="Nome da nova categoria"><div class="palette" id="eNcPal" style="margin-top:10px"></div>${PAL_HINT}<div id="eNcPrev"></div><div class="row2"><span style="flex:1"></span><button type="button" class="btn-text" id="eNcCancel">Cancelar</button><button type="button" class="btn-primary" id="eNcOk" style="height:36px">Criar categoria</button></div></div></div>
      <div class="f"><label class="l">Tipo</label><div class="seg full" id="eType"><button type="button" data-t="evento" class="${it.type==='evento'?'on':''}">Compromisso</button><button type="button" data-t="prazo" class="${it.type==='prazo'?'on':''}">Prazo</button><button type="button" data-t="aviso" class="${it.type==='aviso'?'on':''}">Aviso</button></div>
        <div class="hint" id="eTypeHint"></div></div>
      <div class="f">
        <div class="toggle ${ranged?'on':''}" id="eRange"><span>Vários dias</span><div class="sw2"></div></div>
        <div class="f2" style="margin-top:6px">
          <div id="eStartWrap" class="${ranged?'':'hidden'}"><label class="l">Início</label><input type="date" class="in" id="eStart" value="${it.start||''}"></div>
          <div><label class="l" id="eDateLbl">${ranged?'Fim':'Data'}</label><input type="date" class="in" id="eDate" value="${it.date}"></div>
        </div>
      </div>
      <div class="f">
        <div class="toggle ${allDay?'on':''}" id="eAll"><span>Dia inteiro</span><div class="sw2"></div></div>
        <div class="f2 ${allDay?'hidden':''}" id="eTimes" style="margin-top:6px">
          <div><label class="l">Das</label><input type="time" class="in" id="eTime" value="${it.time||''}"></div>
          <div><label class="l">Até</label><input type="time" class="in" id="eTimeEnd" value="${it.timeEnd||''}"></div>
        </div>
      </div>
      <div class="f"><label class="l">Observação</label><textarea class="in" id="eNote" rows="2" style="min-height:58px" placeholder="Curta e direta. Aparece no calendário e nas listas.">${esc(it.note)}</textarea></div>
      <div class="f"><label class="l">Algo mais? <span style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint);margin-left:4px">não aparece no calendário</span></label><textarea class="in" id="eMore" placeholder="Links, documentos, detalhes…">${esc(it.more||'')}</textarea><div class="links" id="eLinks"></div></div>
      <div class="f" id="eDoneWrap"><div class="toggle ${it.done?'on':''}" id="eDone"><span>Feito</span><div class="sw2"></div></div></div>
    </div>
    <div class="m-f">${ex?'<button class="btn-text danger" data-del>Excluir</button><button class="btn-text" data-dup>Duplicar</button>':''}<span class="sp"></span><span class="kbd d-only">Shift+Enter para salvar</span><button class="btn-text" data-x>Cancelar</button><button class="btn-primary" data-save>Salvar</button></div>`);
  const q = sel => s.querySelector(sel);
  const hints = {evento:'Algo que acontece numa data, como uma prova ou cerimônia.', prazo:'Algo que você precisa fazer. Pode ser marcado como concluído.', aviso:'Resultado ou divulgação. Não exige ação.'};
  const setHint = () => q('#eTypeHint').textContent = hints[it.type];
  setHint();
  const drawCats = () => { q('#eCat').innerHTML = catsArr().map(c=>`<button type="button" class="${c.id===it.cat?'on':''}" data-c="${c.id}" style="--c:${c.color}"><i></i>${esc(c.name)}</button>`).join(''); };
  drawCats();

  const drawNc = () => { q('#eNcPal').innerHTML = paletteHTML(ncColor); q('#eNcPrev').innerHTML = catPreviewHTML(q('#eNcName').value.trim(), ncColor); };
  drawNc(); q('#eNcName').addEventListener('input', drawNc);
  s.querySelector('.m-b').addEventListener('click', e => { if (e.target.closest('[data-newcat]')){ e.preventDefault(); q('#eNewCat').classList.remove('hidden'); q('#eNcName').focus(); } });
  q('#eCat').onclick = e => {
    if (e.target.closest('[data-newcat]')) return;
    const b = e.target.closest('[data-c]'); if(!b) return; it.cat = b.dataset.c; drawCats();

  q('#eNcPal').onclick = e => { const b = e.target.closest('[data-p]'); if(!b) return; ncColor = b.dataset.p; drawNc(); };
  q('#eNcCancel').onclick = () => q('#eNewCat').classList.add('hidden');
  const createCat = () => { const n = q('#eNcName').value.trim(); if(!n){ q('#eNcName').focus(); return; } const c = {id:'c'+uid(), name:n, color:ncColor, order:catsArr().length+1}; putCat(c); it.cat = c.id; q('#eNcName').value=''; q('#eNewCat').classList.add('hidden'); ncColor = PALETTE.find(p=>!catsArr().some(x=>x.color===p)) || PALETTE[0]; drawNc(); drawCats(); };

  drawLinks(); q('#eNote').addEventListener('input', drawLinks); q('#eMore').addEventListener('input', drawLinks);
  q('#eType').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; it.type = b.dataset.t; q('#eType').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); setHint(); };
  q('#eRange').onclick = () => { const on = !q('#eRange').classList.contains('on'); q('#eRange').classList.toggle('on', on); q('#eStartWrap').classList.toggle('hidden', !on); q('#eDateLbl').textContent = on?'Fim':'Data'; if (on && !q('#eStart').value) q('#eStart').value = q('#eDate').value; };
  q('#eAll').onclick = () => { const on = !q('#eAll').classList.contains('on'); q('#eAll').classList.toggle('on', on); q('#eTimes').classList.toggle('hidden', on); };
  q('#eDone').onclick = () => q('#eDone').classList.toggle('on');
  s.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeModal());
  const save = () => {
    const title = q('#eTitle').value.trim();
    if (!title){ q('#eTitle').focus(); q('#eTitle').style.borderColor='var(--danger)'; return; }
    const date = q('#eDate').value; if (!date){ q('#eDate').focus(); return; }
    let start = q('#eRange').classList.contains('on') ? q('#eStart').value : '';
    if (start && start > date){ toast('A data de início precisa ser antes do fim.'); return; }
    if (start === date) start = '';
    const allD = q('#eAll').classList.contains('on');
    const out = {...it, title, date, start, time: allD?'':q('#eTime').value, timeEnd: allD?'':q('#eTimeEnd').value, note:q('#eNote').value.trim(), more:q('#eMore').value.trim(), done: q('#eDone').classList.contains('on')};
    putItem(out); closeModal(); toast(ex?'Alterações salvas':'Compromisso criado');
  };
  q('[data-save]').onclick = save;
  if (ex) q('[data-dup]').onclick = () => { closeModal(true); openEditor(null, {copy:{...ex, id:uid(), done:false, title:ex.title}}); };
  if (ex) q('[data-del]').onclick = () => confirmBox('Excluir compromisso', `"${esc(ex.title)}" será removido de todos os aparelhos.`, 'Excluir', () => { const old = delItem(ex.id); toast('Compromisso excluído', 'Desfazer', () => putItem(old)); });
  s.addEventListener('keydown', e => {
    if (e.key==='Enter' && e.shiftKey){ e.preventDefault(); save(); }
    else if (e.key==='Enter' && e.target.tagName==='INPUT' && e.target.id!=='eNcName'){ e.preventDefault(); }
  });
  if (!ex && !preset.copy) setTimeout(()=>q('#eTitle').focus(), 60);
}

function paletteHTML(sel, exceptId){
  const used = {}; catsArr().forEach(c => { if (c.id!==exceptId) used[c.color] = (used[c.color]?used[c.color]+', ':'') + c.name; });
  return PALETTE.map(p=>`<button type="button" class="${p===sel?'on':''} ${used[p]?'used':''}" style="--c:${p}" data-p="${p}" title="${used[p]?'Em uso: '+esc(used[p]):'Livre'}"></button>`).join('');
}
const PAL_HINT = '<div class="pal-hint"><i></i>cor já usada por outra categoria</div>';
function catPreviewHTML(name, color, short){
  const nm = name || 'Nova categoria', sh = (short && short.trim()) || catShort({name:nm});
  return `<div class="prev" style="--c:${color}">
    <div><div class="pl">Etiqueta</div><div class="catpick"><button type="button" class="on" style="--c:${color}" tabindex="-1"><i></i>${esc(nm)}</button></div></div>
    <div><div class="pl">No calendário</div><div class="pill card" style="--c:${color}"><div class="ph"><i class="pc">${CHK}</i><b class="tg">${esc(sh)}</b></div><div class="pt">Exemplo de compromisso</div><div class="pn">Observação curta</div></div></div>
    <div><div class="pl">Nas listas</div><div class="row-demo"><span class="bar"></span><div>Exemplo de compromisso<small>${esc(nm)}</small></div></div></div>
  </div>`;
}
function openCatEditor(id){
  const ex = id ? S.cats[id] : null;
  const c = ex ? {...ex} : {id:'c'+uid(), name:'', color: PALETTE.find(p=>!catsArr().some(x=>x.color===p)) || PALETTE[0], order: catsArr().length+1};
  const s = openModal(`
    <div class="m-h"><h3>${ex?'Editar categoria':'Nova categoria'}</h3><button class="icon-btn" data-x>${I.x}</button></div>
    <div class="m-b">
      <div class="f"><label class="l">Nome</label><input class="in" id="cName" value="${esc(c.name)}" placeholder="Ex.: Plantões"></div>
      <div class="f"><label class="l">Sigla no calendário (opcional)</label><input class="in" id="cShort" value="${esc(c.short||'')}" maxlength="10" placeholder="${esc(catShort({name:c.name||'Plantões'}))}"><div class="hint">Texto curto que aparece antes do título no calendário.</div></div>
      <div class="f"><label class="l">Cor</label><div class="palette" id="cPal"></div>${PAL_HINT}<div id="cPrev"></div></div>
    </div>
    <div class="m-f">${ex?'<button class="btn-text danger" data-del>Excluir</button>':''}<span class="sp"></span><button class="btn-text" data-x>Cancelar</button><button class="btn-primary" data-save>Salvar</button></div>`, 'sm');
  const q = sel => s.querySelector(sel);
  const drawC = () => { q('#cPal').innerHTML = paletteHTML(c.color, ex?ex.id:null); q('#cPrev').innerHTML = catPreviewHTML(q('#cName').value.trim(), c.color, q('#cShort').value); };
  drawC(); q('#cName').addEventListener('input', drawC); q('#cShort').addEventListener('input', drawC);
  q('#cPal').onclick = e => { const b = e.target.closest('[data-p]'); if(!b) return; c.color = b.dataset.p; drawC(); };
  s.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeModal());
  const save = () => { const n = q('#cName').value.trim(); if(!n){ q('#cName').focus(); return; } putCat({...c, name:n, short:q('#cShort').value.trim()}); closeModal(); };
  q('[data-save]').onclick = save;
  s.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); save(); } });
  if (ex) q('[data-del]').onclick = () => {
    const n = itemsArr().filter(i=>i.cat===ex.id).length;
    const others = catsArr().filter(x=>x.id!==ex.id);
    if (!others.length){ toast('Mantenha pelo menos uma categoria.'); return; }
    confirmBox('Excluir categoria', n ? `Os ${n} itens de "${esc(ex.name)}" passarão para "${esc(others[others.length-1].name)}".` : `"${esc(ex.name)}" será removida.`, 'Excluir', () => {
      itemsArr().filter(i=>i.cat===ex.id).forEach(i => putItem({...i, cat: others[others.length-1].id}));
      delCat(ex.id); S.prefs.hidden = S.prefs.hidden.filter(h=>h!==ex.id); savePrefs(); render();
    });
  };
  setTimeout(()=>q('#cName').focus(), 60);
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg, actLbl, act){
  const t = $('#toast'), b = t.querySelector('button');
  t.querySelector('span').textContent = msg;
  if (actLbl){ b.textContent = actLbl; b.classList.remove('hidden'); b.onclick = () => { act(); t.classList.remove('show'); }; }
  else b.classList.add('hidden');
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), actLbl?5000:2400);
}

/* ---------- Exportações ---------- */
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportICS(){
  const t = todayIso(), stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const escI = s => String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
  const d8 = s => s.replace(/-/g,'');
  let out = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//jaaacked//Agenda//PT','CALSCALE:GREGORIAN','X-WR-CALNAME:Agenda'];
  itemsArr().filter(it => it.date >= t && !it.done && it.type!=='aviso').forEach(it => {
    const c = cat(it.cat);
    out.push('BEGIN:VEVENT','UID:'+it.id+'@agenda-jaaacked','DTSTAMP:'+stamp);
    if (it.time){
      out.push('DTSTART:'+d8(it.date)+'T'+it.time.replace(':','')+'00');
      out.push('DTEND:'+d8(it.date)+'T'+(it.timeEnd||it.time).replace(':','')+'00');
    } else {
      out.push('DTSTART;VALUE=DATE:'+d8(it.start||it.date), 'DTEND;VALUE=DATE:'+d8(iso(addDays(parse(it.date),1))));
    }
    out.push('SUMMARY:'+escI((it.type==='prazo'?'Prazo: ':'')+it.title+' ('+c.name+')'));
    if (it.note || it.more) out.push('DESCRIPTION:'+escI([it.note, it.more].filter(Boolean).join('\n\n')));
    out.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+escI(it.title), it.time ? 'TRIGGER:-PT2H' : (it.start ? 'TRIGGER;VALUE=DATE-TIME:'+d8(iso(addDays(parse(it.date),-1)))+'T090000' : 'TRIGGER:-PT15H'),'END:VALARM','END:VEVENT');
  });
  out.push('END:VCALENDAR');
  download('agenda.ics', out.join('\r\n'), 'text/calendar');
  toast('Arquivo gerado. Abra-o para importar na agenda do celular.');
}
function exportJSON(){ download('agenda-backup-'+todayIso()+'.json', JSON.stringify({items:S.items, cats:S.cats, at:Date.now()}, null, 1), 'application/json'); }
function importJSON(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange = async () => {
    try {
      const data = JSON.parse(await inp.files[0].text());
      if (!data.items || !data.cats) throw 0;
      confirmBox('Restaurar backup', `${Object.keys(data.items).length} itens serão restaurados. Itens atuais com o mesmo identificador serão substituídos.`, 'Restaurar', () => {
        Object.values(data.cats).forEach(putCat); Object.values(data.items).forEach(putItem); toast('Backup restaurado');
      });
    } catch(e){ toast('Arquivo inválido.'); }
  };
  inp.click();
}

/* ---------- Navegação ---------- */
function shift(n){
  if (S.view==='cal' && S.prefs.calMode==='semana'){
    S.weekRef = addDays(S.weekRef||new Date(), 7*n);
    S.cursor = new Date(S.weekRef.getFullYear(), S.weekRef.getMonth(), 1);
  } else {
    S.cursor = new Date(S.cursor.getFullYear(), S.cursor.getMonth()+n, 1);
    const t = new Date();
    S.sel = (t.getFullYear()===S.cursor.getFullYear() && t.getMonth()===S.cursor.getMonth()) ? todayIso() : iso(S.cursor);
  }
  render();
}
function goToday(){ S.cursor = new Date(); S.cursor.setDate(1); S.weekRef = new Date(); S.sel = todayIso(); render(); }
function setView(v){ S.view = v; S.q=''; S.searchOpen=false; render(); $('#view').scrollTop = 0; }
function bindSwipe(){
  const g = $('#mgrid'); if (!g) return;
  let x0=null, y0=null;
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  g.addEventListener('touchend', e => {
    if (x0===null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5) shift(dx<0?1:-1);
    x0 = null;
  }, {passive:true});
}

/* ---------- Arrastar para outro dia ---------- */
let drag = null, suppressClick = false;
function beginDrag(x, y){
  drag.started = true;
  const r = drag.src.getBoundingClientRect();
  const g = drag.src.cloneNode(true);
  g.classList.add('drag-ghost'); g.style.width = Math.min(r.width, 260) + 'px';
  drag.ox = Math.min(x - r.left, 120); drag.oy = y - r.top;
  document.body.appendChild(g); drag.ghost = g;
  drag.src.classList.add('drag-src'); document.body.classList.add('dragging');
  navigator.vibrate?.(12);
  moveGhost(x, y);
}
function moveGhost(x, y){
  drag.ghost.style.transform = `translate(${x - drag.ox}px, ${y - drag.oy}px) rotate(-1.5deg)`;
  const cell = document.elementFromPoint(x, y)?.closest('[data-cell]');
  if (drag.over !== cell){ drag.over?.classList.remove('drop'); cell?.classList.add('drop'); drag.over = cell; }
}
function cleanupDrag(){
  if (!drag) return;
  drag.ghost?.remove(); drag.src.classList.remove('drag-src'); drag.over?.classList.remove('drop'); document.body.classList.remove('dragging');
}
function endDrag(){
  const cell = drag.over, it = S.items[drag.id], kind = drag.kind;
  cleanupDrag();
  suppressClick = true; setTimeout(()=>suppressClick=false, 50);
  if (!cell || !it) return;
  const day = cell.dataset.cell, base = kind==='start' ? it.start : it.date;
  const delta = diffDays(day, base);
  if (!delta) return;
  const old = {...it};
  const moved = {...it, date: iso(addDays(parse(it.date), delta)), start: it.start ? iso(addDays(parse(it.start), delta)) : ''};
  putItem(moved);
  toast(`Movido para ${dateTag(kind==='start'?moved.start:moved.date)}`, 'Desfazer', () => putItem(old));
}
document.addEventListener('pointerdown', e => {
  const src = e.target.closest('[data-drag]');
  if (!src || e.target.closest('[data-done]') || e.button > 0 || S.view !== 'cal') return;
  drag = {src, id:src.dataset.drag, kind:src.dataset.kind||'main', x:e.clientX, y:e.clientY, started:false, touch:e.pointerType !== 'mouse'};
  if (drag.touch) drag.timer = setTimeout(() => { if (drag && !drag.started) beginDrag(drag.x, drag.y); }, 380);
  else e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    const dist = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
    if (drag.touch){ if (dist > 10){ clearTimeout(drag.timer); drag = null; } return; }
    if (dist < 6) return;
    beginDrag(e.clientX, e.clientY);
  }
  moveGhost(e.clientX, e.clientY);
});
document.addEventListener('pointerup', () => { if (!drag) return; clearTimeout(drag.timer); if (drag.started) endDrag(); drag = null; });
document.addEventListener('pointercancel', () => { if (!drag) return; clearTimeout(drag.timer); cleanupDrag(); drag = null; });
document.addEventListener('touchmove', e => { if (drag && drag.started) e.preventDefault(); }, {passive:false});
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]') && S.view==='cal') e.preventDefault(); });
document.addEventListener('click', e => { if (suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

/* ---------- Eventos globais ---------- */
function $(s){ return document.querySelector(s); }
document.addEventListener('click', e => {
  const t = e.target;
  const done = t.closest('[data-done]');
  if (done){ e.stopPropagation(); const it = S.items[done.dataset.done]; if (it){ putItem({...it, done:!it.done}); toast(it.done?'Marcado como pendente':'Marcado como feito', 'Desfazer', () => putItem({...it})); } return; }
  const mh = t.closest('[data-month]'); if (mh){ const k = mh.dataset.month; S.openMonths.has(k) ? S.openMonths.delete(k) : S.openMonths.add(k); renderView(); return; }
  const fold = t.closest('[data-fold]'); if (fold){ const k = fold.dataset.fold; S.prefs[k] = !S.prefs[k]; savePrefs(); renderMini(); renderCats(); return; }
  const v = t.closest('[data-view]'); if (v){ setView(v.dataset.view); return; }
  const open = t.closest('[data-open]'); if (open){ openEditor(open.dataset.open); return; }
  const day = t.closest('[data-day]'); if (day){ S.sel = day.dataset.day; const d = parse(S.sel); S.cursor = new Date(d.getFullYear(), d.getMonth(), 1); S.weekRef = d; if (S.view!=='cal') S.view='cal'; S.q=''; render(); return; }
  const cell = t.closest('[data-cell]');
  if (cell){
    const s = cell.dataset.cell;
    if (S.sel === s && window.innerWidth > 860) { openEditor(null, {date:s}); return; }
    S.sel = s; const d = parse(s);
    if (S.prefs.calMode==='mes' && d.getMonth()!==S.cursor.getMonth()) S.cursor = new Date(d.getFullYear(), d.getMonth(), 1);
    if (S.prefs.calMode==='semana') { openEditor(null, {date:s}); return; }
    render(); return;
  }
  const nw = t.closest('[data-newon]'); if (nw){ openEditor(null, {date:nw.dataset.newon}); return; }
  const ec0 = t.closest('[data-editcat]'); if (ec0){ openCatEditor(ec0.dataset.editcat); return; }
  const tc = t.closest('[data-togglecat]'); if (tc){ const id = tc.dataset.togglecat; const h = S.prefs.hidden; S.prefs.hidden = h.includes(id) ? h.filter(x=>x!==id) : [...h,id]; savePrefs(); render(); return; }
  const cm = t.closest('[data-calmode]'); if (cm){ S.prefs.calMode = cm.dataset.calmode; if (cm.dataset.calmode==='semana'){ S.weekRef = parse(S.sel); S.cursor = new Date(S.weekRef.getFullYear(), S.weekRef.getMonth(), 1); } savePrefs(); render(); return; }
  const th = t.closest('[data-theme]'); if (th && !th.matches('html')){ S.prefs.theme = th.dataset.theme; savePrefs(); applyTheme(); render(); return; }
  const ec = t.closest('[data-editcat]'); if (ec){ openCatEditor(ec.dataset.editcat); return; }
  const a = t.closest('[data-act]'); if (!a) return;
  ({
    new: () => openEditor(null, {date: S.view==='cal' ? S.sel : todayIso()}),
    prev: () => shift(-1), next: () => shift(1), today: goToday,
    side: () => { S.prefs.sideOff = !S.prefs.sideOff; savePrefs(); applySide(); },
    allcats: () => { S.prefs.hidden = []; savePrefs(); render(); },
    search: () => { S.searchOpen = !S.searchOpen; if (!S.searchOpen) S.q=''; render(); },
    newcat: () => openCatEditor(null),
    ics: exportICS, export: exportJSON, import: importJSON,
    logout: () => confirmBox('Sair', 'Você poderá entrar de novo com o mesmo usuário. Seus dados continuam salvos.', 'Sair', () => { localStorage.removeItem(LS('user')); location.reload(); })
  })[a.dataset.act]?.();
});
document.addEventListener('keydown', e => {
  if (modalEl){ if (e.key==='Escape') closeModal(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ if (e.key==='Escape'){ S.q=''; S.searchOpen=false; render(); } return; }
  if (e.key==='n' || e.key==='N'){ e.preventDefault(); openEditor(null, {date: S.view==='cal'?S.sel:todayIso()}); }
  else if (e.key==='t' || e.key==='T'){ goToday(); }
  else if (e.key==='ArrowLeft' && S.view==='cal'){ shift(-1); }
  else if (e.key==='ArrowRight' && S.view==='cal'){ shift(1); }
  else if (e.key==='/'){ e.preventDefault(); $('#q')?.focus(); }
});

/* ---------- Tema ---------- */
function applySide(){ $('#app').classList.toggle('side-off', !!S.prefs.sideOff); }
function applyTheme(){
  document.documentElement.dataset.theme = S.prefs.theme;
  const dark = S.prefs.theme==='dark' || (S.prefs.theme==='auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.removeAttribute('media'); m.content = dark ? '#111214' : '#F6F7F8'; });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ---------- Início ---------- */
function start(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  if (!S.cats || !Object.keys(S.cats).length) S.cats = Object.fromEntries(DEFAULT_CATS.map(c=>[c.id,c]));
  if (!S.items) S.items = FIREBASE_CONFIG ? {} : buildSeed();
  persist(); applySide(); render(); initSync();
  if (!FIREBASE_CONFIG) migrateNotes();
  // atualiza "hoje" quando o dia vira ou o app volta ao primeiro plano
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
}
function login(){
  const v = $('#loginUser').value.trim().toLowerCase();
  if (v === USER){ store('user', USER); start(); }
  else { $('#loginErr').textContent = v ? 'Usuário não encontrado.' : 'Digite seu usuário.'; }
}
applyTheme();
$('#loginBtn').onclick = login;
$('#loginUser').addEventListener('keydown', e => { if (e.key==='Enter') login(); });
if (load('user', null) === USER) start();
else { $('#login').classList.remove('hidden'); setTimeout(()=>$('#loginUser').focus(), 50); }

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
