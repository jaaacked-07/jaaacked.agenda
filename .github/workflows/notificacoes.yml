name: Notificações da agenda

# Roda em ciclos de ~5h50 conferindo a cada 5 minutos e, ao terminar, inicia o próximo ciclo sozinho.
# O agendamento abaixo é só uma reserva para religar o ciclo caso ele pare.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/notificacoes.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: notificacoes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install --no-save --no-audit --no-fund firebase-admin@12 web-push@3
      - name: Enviar notificações (a cada 5 minutos)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          end=$(( $(date +%s) + 5*3600 + 45*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --ff-only origin main || true
            node scripts/notify.mjs; code=$?
            if [ "$code" -eq 3 ]; then break; fi
            sleep 300
          done
      # O GitHub pausa tarefas agendadas após 60 dias sem alterações no repositório.
      - name: Manter agendamento ativo
        run: |
          git pull -q --ff-only origin main || true
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 3888000 ]; then
            git config user.name "agenda-bot"
            git config user.email "agenda-bot@users.noreply.github.com"
            git commit --allow-empty -m "Manter notificações ativas"
            git push
          fi
      - name: Iniciar o próximo ciclo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run notificacoes.yml --ref main --repo "$GITHUB_REPOSITORY"
